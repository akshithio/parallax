<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    /* Design tokens mirrored from the Nix desktop app (styles/globals.css) so the
       popup reads as the same product: same radius scale, border alpha, muted
       foreground, and status colors. Light is the base; dark follows the OS. */
    :root {
      --radius: 0.625rem;
      --background: #ffffff;
      --foreground: #262626;
      --card: #ffffff;
      --muted-foreground: #737373;
      --border: rgba(0, 0, 0, 0.08);
      --secondary: rgba(0, 0, 0, 0.04);
      --accent: rgba(0, 0, 0, 0.05);
      --primary: oklch(0.488 0.217 264);
      --primary-foreground: #ffffff;
      --success: #10b981;
      --destructive: #ef4444;
      --warning: #f59e0b;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0d0d0d;
        --foreground: #f5f5f5;
        --card: #141414;
        --muted-foreground: #8a8a8a;
        --border: rgba(255, 255, 255, 0.10);
        --secondary: rgba(255, 255, 255, 0.05);
        --accent: rgba(255, 255, 255, 0.06);
        --success: #34d399;
        --destructive: #f87171;
        --warning: #fbbf24;
        color-scheme: dark;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      background: var(--background);
      color: var(--foreground);
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      padding: 14px;
    }

    /* Header — mirrors the app sidebar's "Nix / Alpha" lockup. */
    .header { display: flex; align-items: center; gap: 7px; margin-bottom: 14px; }
    .wordmark { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
    .pill {
      font-size: 9.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--muted-foreground);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) - 4px);
      padding: 1.5px 5px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      overflow: hidden;
    }
    .row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 10px;
      font-size: 12px;
    }
    .row + .row { border-top: 1px solid var(--border); }
    .label { color: var(--muted-foreground); }
    .status { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--muted-foreground); }
    .dot.ok { background: var(--success); }
    .dot.bad { background: var(--destructive); }
    .dot.warn { background: var(--warning); }

    label.field {
      display: block;
      margin: 12px 0 5px;
      font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted-foreground);
    }
    input[type="text"] {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) - 2px);
      background: var(--secondary);
      color: var(--foreground);
      font-size: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--primary); }

    button {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid transparent;
      border-radius: calc(var(--radius) - 2px);
      font-size: 12.5px; font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      margin-top: 8px;
      transition: background .15s, opacity .15s;
    }
    button.primary { background: var(--primary); color: var(--primary-foreground); }
    button.primary:hover { opacity: .9; }
    button.secondary {
      background: transparent; color: var(--foreground);
      border-color: var(--border);
    }
    button.secondary:hover { background: var(--accent); }
    button:disabled { opacity: .4; cursor: default; }

    .note {
      margin-top: 9px;
      font-size: 11px; line-height: 1.45;
      color: var(--muted-foreground);
    }
    .note.error { color: var(--destructive); }
    .note:empty { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <span class="wordmark">Nix</span>
    <span class="pill">Alpha</span>
  </div>

  <div class="card">
    <div class="row">
      <span class="label">Desktop app</span>
      <span class="status"><span class="dot" id="ws-dot"></span><span id="ws-label">—</span></span>
    </div>
    <div class="row">
      <span class="label">ChatGPT tab</span>
      <span class="status"><span class="dot" id="tab-dot"></span><span id="tab-label">—</span></span>
    </div>
    <div class="row">
      <span class="label">Page bridge</span>
      <span class="status"><span class="dot" id="content-dot"></span><span id="content-label">—</span></span>
    </div>
  </div>

  <label class="field" for="ws-url">WebSocket</label>
  <input type="text" id="ws-url" value="ws://localhost:8765" spellcheck="false" />

  <button class="primary" id="connect-btn">Reconnect</button>
  <button class="secondary" id="heal-btn">Reconnect page bridge</button>

  <div class="note error" id="error-msg"></div>
  <div class="note" id="hint"></div>

  <script src="popup.js"></script>
</body>
</html>
