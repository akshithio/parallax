name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:versions
      - run: pnpm --filter parallax-desktop run verify:release-tag
      - run: pnpm --filter parallax-desktop run verify:release-env
      - run: pnpm --filter parallax-desktop exec playwright install chromium
      - run: pnpm verify
      - run: pnpm --filter parallax-extension package
      - run: pnpm --filter parallax-desktop run release:mac
      - run: gh release upload "$GITHUB_REF_NAME" parallax-extension/dist/*.zip --clobber
